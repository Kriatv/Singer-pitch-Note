<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Singer Pitch Note</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px 40px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(circle at top, #18233d 0%, #0b1120 55%, #070b14 100%);
  color: white;
  text-align: center;
}

.container {
  max-width: 760px;
  margin: auto;
}

h1 {
  font-size: 34px;
  margin: 10px 0 6px;
  font-weight: 800;
}

.subtitle {
  color: #aebbd1;
  font-size: 17px;
  margin-bottom: 22px;
}

/* Main card */

.card {
  background: rgba(25, 36, 58, 0.92);
  border: 1px solid #314361;
  border-radius: 28px;
  padding: 24px 18px;
  margin-bottom: 20px;
  box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

/* Pitch */

.pitch-label {
  color: #9eabc1;
  font-size: 16px;
  margin-top: 2px;
}

#note {
  font-size: 82px;
  line-height: 1;
  font-weight: 800;
  margin: 12px 0 5px;
  color: #f8fafc;
}

#frequency {
  font-size: 21px;
  color: #8ecaff;
}

#cents {
  font-size: 18px;
  margin-top: 8px;
  font-weight: 700;
}

/* Pitch meter */

.meter-title {
  margin-top: 28px;
  color: #aab7cd;
  font-size: 15px;
}

.meter {
  position: relative;
  height: 18px;
  background: #2a3a59;
  border-radius: 20px;
  margin: 12px 8px 5px;
  overflow: hidden;
}

.meter-center {
  position: absolute;
  left: 50%;
  top: 0;
  width: 4px;
  height: 100%;
  transform: translateX(-50%);
  background: white;
  z-index: 3;
  border-radius: 5px;
}

.needle {
  position: absolute;
  top: -7px;
  left: 50%;
  width: 7px;
  height: 32px;
  background: #55d6f5;
  border-radius: 8px;
  transform: translateX(-50%);
  transition: left .08s linear;
  z-index: 4;
  box-shadow: 0 0 12px rgba(85,214,245,.7);
}

.meter-labels {
  display: flex;
  justify-content: space-between;
  color: #9eabc1;
  font-size: 14px;
  padding: 0 5px;
}

.perfect {
  color: #34d399 !important;
}

.flat {
  color: #60a5fa !important;
}

.sharp {
  color: #fb923c !important;
}

.off {
  color: #f87171 !important;
}

/* Status */

#status {
  margin-top: 20px;
  font-size: 18px;
  font-weight: 700;
  color: #cbd5e1;
}

/* Buttons */

.controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 22px;
}

button {
  border: none;
  border-radius: 16px;
  padding: 15px 20px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  min-height: 54px;
}

.start {
  background: #22c55e;
  color: #06140b;
  flex: 1;
}

.stop {
  background: #8f3541;
  color: white;
  flex: .7;
}

button:active {
  transform: scale(.97);
}

/* Target */

.target-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 20px;
}

.target-controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
}

select {
  background: #101827;
  color: white;
  border: 2px solid #40516e;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 20px;
  min-width: 110px;
}

.play {
  background: #f3f4f6;
  color: #1479dc;
  flex: 1;
  max-width: 260px;
}

.target-message {
  margin-top: 18px;
  color: #8e9bb1;
  line-height: 1.5;
}

/* Statistics */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.stat {
  background: #111b2d;
  border-radius: 16px;
  padding: 14px 5px;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
}

.stat-label {
  color: #8997ad;
  font-size: 12px;
  margin-top: 4px;
}

/* Target success */

.success {
  animation: successPulse .7s ease;
}

@keyframes successPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@media (max-width: 500px) {

  body {
    padding: 15px 10px 30px;
  }

  h1 {
    font-size: 30px;
  }

  .card {
    border-radius: 24px;
    padding: 20px 14px;
  }

  #note {
    font-size: 72px;
  }

  .target-controls {
    flex-direction: row;
  }

  button {
    font-size: 16px;
  }
}

</style>
</head>

<body>

<div class="container">

  <h1>🎤 Singer Pitch Note</h1>

  <div class="subtitle">
    Real-time pitch detection & vocal training
  </div>

  <!-- PITCH CARD -->

  <div class="card">

    <div class="pitch-label">CURRENT NOTE</div>

    <div id="note">—</div>

    <div id="frequency">
      Frequency: — Hz
    </div>

    <div id="cents">
      Sing a note
    </div>

    <div class="meter-title">
      PITCH ACCURACY
    </div>

    <div class="meter">

      <div class="meter-center"></div>

      <div id="needle" class="needle"></div>

    </div>

    <div class="meter-labels">
      <span>♭ LOW</span>
      <span>PERFECT</span>
      <span>HIGH ♯</span>
    </div>

    <div id="status">
      Microphone is off
    </div>

    <div class="controls">

      <button class="start" onclick="startPitch()">
        🎤 Start Singing
      </button>

      <button class="stop" onclick="stopPitch()">
        ⏹ Stop
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <div id="accuracy" class="stat-value">—</div>
        <div class="stat-label">ACCURACY</div>
      </div>

      <div class="stat">
        <div id="inTune" class="stat-value">0s</div>
        <div class="stat-label">IN TUNE</div>
      </div>

      <div class="stat">
        <div id="samples" class="stat-value">0</div>
        <div class="stat-label">NOTES</div>
      </div>

    </div>

  </div>


  <!-- TARGET NOTE -->

  <div class="card">

    <div class="target-title">
      🎯 Target Note
    </div>

    <div class="target-controls">

      <select id="targetNote">

      

  <option>C2</option>
  <option>C#2</option>
  <option>D2</option>
  <option>D#2</option>
  <option>E2</option>
  <option>F2</option>
  <option>F#2</option>
  <option>G2</option>
  <option>G#2</option>
  <option>A2</option>
  <option>A#2</option>
  <option>B2</option>

  <option>C3</option>
  <option>C#3</option>
  <option>D3</option>
  <option>D#3</option>
  <option>E3</option>
  <option>F3</option>
  <option>F#3</option>
  <option>G3</option>
  <option>G#3</option>
  <option>A3</option>
  <option>A#3</option>
  <option>B3</option>

  <option>C4</option>
  <option>C#4</option>
  <option>D4</option>
  <option>D#4</option>
  <option>E4</option>
  <option>F4</option>
  <option>F#4</option>
  <option selected>G4</option>
  <option>G#4</option>
  <option>A4</option>
  <option>A#4</option>
  <option>B4</option>

  <option>C5</option>
  <option>C#5</option>
  <option>D5</option>
  <option>D#5</option>
  <option>E5</option>
  <option>F5</option>
  <option>F#5</option>
  <option>G5</option>
  <option>G#5</option>
  <option>A5</option>
  <option>A#5</option>
  <option>B5</option>

  <option>C6</option>
  <option>C#6</option>
  <option>D6</option>
  <option>D#6</option>
  <option>E6</option>
  <option>F6</option>
  <option>F#6</option>
  <option>G6</option>
  <option>G#6</option>
  <option>A6</option>
  <option>A#6</option>
  <option>B6</option>


      </select>

      <button class="play" onclick="playTarget()">
        🔊 Play Target
      </button>

    </div>

    <div id="targetMessage" class="target-message">
      Try to match the target note.
      Keep the needle close to the center.
    </div>

  </div>

</div>


<script>


let audioContext = null;

let analyser = null;

let microphone = null;

let stream = null;

let animationId = null;

let running = false;

let totalSamples = 0;

let accurateSamples = 0;

let inTuneSeconds = 0;

let lastGoodTime = null;

let lastDetectedNote = "";

let stablePitch = null;

/* =========================s

   START MICROPHONE

========================= */

async function startPitch() {

  if (running) return;

  try {

    if (!navigator.mediaDevices ||

        !navigator.mediaDevices.getUserMedia) {

      document.getElementById("status").innerText =

        "Microphone is not supported in this browser.";

      return;

    }

    document.getElementById("status").innerText =

      "🎤 Requesting microphone...";

    stream = await navigator.mediaDevices.getUserMedia({

      audio: {

        echoCancellation: false,

        noiseSuppression: false,

        autoGainControl: false,

        channelCount: 1

      }

    });

    audioContext =

      new (window.AudioContext ||

           window.webkitAudioContext)();

    await audioContext.resume();

    microphone =

      audioContext.createMediaStreamSource(stream);

    analyser =

      audioContext.createAnalyser();

    analyser.fftSize = 4096;

    analyser.smoothingTimeConstant = 0.15;

    microphone.connect(analyser);

    running = true;

    totalSamples = 0;

    accurateSamples = 0;

    inTuneSeconds = 0;

    lastGoodTime = performance.now();

    lastDetectedNote = "";

    stablePitch = null;

    document.getElementById("accuracy").innerText = "0%";

    document.getElementById("inTune").innerText = "0.0s";

    document.getElementById("samples").innerText = "0";

    document.getElementById("status").innerText =

      "🎤 Listening... Sing a clear note";

    detectPitch();

  }

  catch (error) {

    console.log("Microphone error:", error);

    if (error.name === "NotAllowedError") {

      document.getElementById("status").innerText =

        "❌ Microphone permission denied. Allow microphone access.";

    }

    else if (error.name === "NotFoundError") {

      document.getElementById("status").innerText =

        "❌ No microphone found.";

    }

    else {

      document.getElementById("status").innerText =

        "❌ Microphone error. Try again.";

    }

  }

}

/* =========================

   STOP

========================= */

function stopPitch() {

  running = false;

  if (animationId) {

    cancelAnimationFrame(animationId);

    animationId = null;

  }

  if (stream) {

    stream.getTracks().forEach(track => {

      track.stop();

    });

    stream = null;

  }

  if (audioContext) {

    audioContext.close();

    audioContext = null;

  }

  analyser = null;

  microphone = null;

  stablePitch = null;

  document.getElementById("status").innerText =

    "Microphone is off";

  document.getElementById("note").innerText =

    "—";

  document.getElementById("frequency").innerText =

    "Frequency: — Hz";

  document.getElementById("cents").innerText =

    "Sing a note";

  document.getElementById("cents").className = "";

  document.getElementById("needle").style.left =

    "50%";

}

/* =========================

   MAIN DETECTION LOOP

========================= */

function detectPitch() {

  if (!running || !analyser) return;

  const buffer =

    new Float32Array(analyser.fftSize);

  analyser.getFloatTimeDomainData(buffer);

  const frequency =

    autoCorrelate(

      buffer,

      audioContext.sampleRate

    );

  if (frequency > 0) {

    /*

       Smooth pitch to prevent jumping

    */

    if (stablePitch === null) {

      stablePitch = frequency;

    } else {

      stablePitch =

        stablePitch * 0.75 +

        frequency * 0.25;

    }

    const result =

      frequencyToNote(stablePitch);

    document.getElementById("note").innerText =

      result.note;

    document.getElementById("frequency").innerText =

      "Frequency: " +

      stablePitch.toFixed(1) +

      " Hz";

    updatePitch(result);

  }

  animationId =

    requestAnimationFrame(detectPitch);

}

/* =========================

   PITCH DISPLAY

========================= */

function updatePitch(result) {

  const cents = result.cents;

  const centsElement =

    document.getElementById("cents");

  const noteElement =

    document.getElementById("note");

  const statusElement =

    document.getElementById("status");

  const needle =

    document.getElementById("needle");

  centsElement.innerText =

    (cents >= 0 ? "+" : "") +

    cents.toFixed(0) +

    " cents";

  centsElement.className = "";

  /*

     Meter range = -50 to +50 cents

  */

  const position =

    50 +

    Math.max(

      -50,

      Math.min(50, cents)

    );

  needle.style.left =

    position + "%";

  totalSamples++;

  /*

     IN TUNE

     ±10 cents

  */

  if (Math.abs(cents) <= 10) {

    accurateSamples++;

    statusElement.innerText =

      "✓ PERFECT — In tune";

    centsElement.classList.add("perfect");

    const now =

      performance.now();

    if (lastGoodTime !== null) {

      const delta =

        (now - lastGoodTime) / 1000;

      if (delta > 0 && delta < 0.3) {

        inTuneSeconds += delta;

      }

    }

    lastGoodTime = now;

    if (Math.abs(cents) <= 5) {

      noteElement.classList.add("success");

      setTimeout(() => {

        noteElement.classList.remove("success");

      }, 300);

    }

  }

  else {

    lastGoodTime =

      performance.now();

    if (cents < 0) {

      statusElement.innerText =

        Math.abs(cents) > 30

          ? "♭ Too Low"

          : "♭ Slightly Low";

      centsElement.classList.add(

        Math.abs(cents) > 30

          ? "off"

          : "flat"

      );

    }

    else {

      statusElement.innerText =

        Math.abs(cents) > 30

          ? "♯ Too High"

          : "♯ Slightly High";

      centsElement.classList.add(

        Math.abs(cents) > 30

          ? "off"

          : "sharp"

      );

    }

  }

  const accuracy =

    totalSamples > 0

      ? (accurateSamples / totalSamples) * 100

      : 0;

  document.getElementById("accuracy").innerText =

    accuracy.toFixed(0) + "%";

  document.getElementById("inTune").innerText =

    inTuneSeconds.toFixed(1) + "s";

  document.getElementById("samples").innerText =

    totalSamples;

}

/* =========================s
AUTO CRRELATION

========================= */

   function autoCorrelate(buffer, sampleRate) {

  const SIZE = buffer.length;

  // -----------------------------
  // 1. Calculate signal strength
  // -----------------------------

  let rms = 0;

  for (let i = 0; i < SIZE; i++) {
    rms += buffer[i] * buffer[i];
  }

  rms = Math.sqrt(rms / SIZE);

  // Ignore silence and very weak microphone noise
  if (rms < 0.015) {
    return -1;
  }

  // -----------------------------
  // 2. Remove DC offset
  // -----------------------------

  let mean = 0;

  for (let i = 0; i < SIZE; i++) {
    mean += buffer[i];
  }

  mean /= SIZE;

  const signal = new Float32Array(SIZE);

  for (let i = 0; i < SIZE; i++) {
    signal[i] = buffer[i] - mean;
  }

  // -----------------------------
  // 3. Singer frequency range
  // -----------------------------

  const minFreq = 70;
  const maxFreq = 1000;

  const minLag = Math.floor(sampleRate / maxFreq);
  const maxLag = Math.floor(sampleRate / minFreq);

  // -----------------------------
  // 4. Difference function
  //    (YIN-style)
  // -----------------------------

  const difference = new Float32Array(maxLag + 1);

  for (let lag = 1; lag <= maxLag; lag++) {

    let sum = 0;
    const limit = SIZE - lag;

    for (let i = 0; i < limit; i++) {

      const delta =
        signal[i] -
        signal[i + lag];

      sum += delta * delta;
    }

    difference[lag] = sum;
  }

  // -----------------------------
  // 5. Cumulative mean normalized
  //    difference function
  // -----------------------------

  const cmndf =
    new Float32Array(maxLag + 1);

  cmndf[0] = 1;

  let runningSum = 0;

  for (let lag = 1; lag <= maxLag; lag++) {

    runningSum += difference[lag];

    if (runningSum === 0) {
      cmndf[lag] = 1;
    } else {
      cmndf[lag] =
        difference[lag] *
        lag /
        runningSum;
    }
  }

  // -----------------------------
  // 6. Find first strong valley
  // -----------------------------

  const threshold = 0.12;

  let bestLag = -1;

  for (
    let lag = minLag;
    lag < maxLag;
    lag++
  ) {

    if (
      cmndf[lag] < threshold &&
      cmndf[lag] <= cmndf[lag + 1]
    ) {

      bestLag = lag;

      // Continue to the bottom
      while (
        bestLag + 1 <= maxLag &&
        cmndf[bestLag + 1] <
        cmndf[bestLag]
      ) {
        bestLag++;
      }

      break;
    }
  }

  // -----------------------------
  // 7. If no strong valley,
  //    find the best candidate
  // -----------------------------

  if (bestLag === -1) {

    let bestValue = Infinity;

    for (
      let lag = minLag;
      lag <= maxLag;
      lag++
    ) {

      if (cmndf[lag] < bestValue) {

        bestValue =
          cmndf[lag];

        bestLag = lag;
      }
    }

    // Reject weak detection
    if (
      bestLag === -1 ||
      cmndf[bestLag] > 0.30
    ) {
      return -1;
    }
  }

  // -----------------------------
  // 8. Parabolic interpolation
  // -----------------------------

  let refinedLag = bestLag;

  if (
    bestLag > minLag &&
    bestLag < maxLag
  ) {

    const y1 =
      cmndf[bestLag - 1];

    const y2 =
      cmndf[bestLag];

    const y3 =
      cmndf[bestLag + 1];

    const denominator =
      y1 -
      2 * y2 +
      y3;

    if (
      Math.abs(denominator) >
      0.000001
    ) {

      refinedLag =
        bestLag +
        0.5 *
        (y1 - y3) /
        denominator;
    }
  }

  // -----------------------------
  // 9. Convert lag to frequency
  // -----------------------------

  const frequency =
    sampleRate / refinedLag;

  // Final safety check
  if (
    frequency < minFreq ||
    frequency > maxFreq ||
    !Number.isFinite(frequency)
  ) {
    return -1;
  }

  return frequency;
}

   CORRELATION AT LAG

========================= */

function correlationAtLag(signal, lag) {

  const SIZE = signal.length;

  const limit = SIZE - lag;

  let sumXY = 0;

  let sumX2 = 0;

  let sumY2 = 0;

  for (let i = 0; i < limit; i++) {

    const x = signal[i];

    const y = signal[i + lag];

    sumXY += x * y;

    sumX2 += x * x;

    sumY2 += y * y;

  }

  if (sumX2 === 0 || sumY2 === 0) {

    return 0;

  }

  return (

    sumXY /

    Math.sqrt(sumX2 * sumY2)

  );

}

/* =========================

   FREQUENCY → NOTE

========================= */

function frequencyToNote(frequency) {

  const notes = [

    "C", "C#", "D", "D#", "E", "F",

    "F#", "G", "G#", "A", "A#", "B"

  ];

  const exactMidi =

    69 +

    12 *

    Math.log2(frequency / 440);

  const midi =

    Math.round(exactMidi);

  const note =

    notes[

      ((midi % 12) + 12) % 12

    ];

  const octave =

    Math.floor(midi / 12) - 1;

  const cents =

    (exactMidi - midi) * 100;

  return {

    note:

      note + octave,

    midi:

      midi,

    cents:

      cents

  };

}

/* =========================

   NOTE → FREQUENCY

========================= */

function noteToFrequency(note) {

  const notes = [

    "C", "C#", "D", "D#", "E", "F",

    "F#", "G", "G#", "A", "A#", "B"

  ];

  const match =

    note.match(/^([A-G]#?)(\d)$/);

  if (!match) return 440;

  const noteName =

    match[1];

  const octave =

    parseInt(match[2]);

  const noteIndex =

    notes.indexOf(noteName);

  const midi =

    (octave + 1) * 12 +

    noteIndex;

  return 440 *

    Math.pow(

      2,

      (midi - 69) / 12

    );

}

/* =========================

   PLAY TARGET NOTE

========================= */

async function playTarget() {

  const target =

    document.getElementById("targetNote").value;

  const frequency =

    noteToFrequency(target);

  const ctx =

    new (window.AudioContext ||

         window.webkitAudioContext)();

  await ctx.resume();

  const oscillator =

    ctx.createOscillator();

  const gain =

    ctx.createGain();

  oscillator.type =

    "sine";

  oscillator.frequency.value =

    frequency;

  gain.gain.setValueAtTime(

    0,

    ctx.currentTime

  );

  gain.gain.linearRampToValueAtTime(

    0.60,

    ctx.currentTime + 0.05

  );

  gain.gain.linearRampToValueAtTime(

    0,

    ctx.currentTime + 1.2

  );

  oscillator.connect(gain);

  gain.connect(ctx.destination);

  oscillator.start();

  oscillator.stop(

    ctx.currentTime + 1.2

  );

  document.getElementById(

    "targetMessage"

  ).innerText =

    "🎯 Target: " +

    target +

    " — now sing and match it.";

}



</script>

</body>
</html>
